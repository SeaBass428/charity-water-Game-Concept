<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pipe Feed</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="game">
    <header class="banner">
      <h1>PIPE FEED</h1>
    </header>
    <section class="game-layout" aria-label="Pipe Feed game">
      <aside class="info-panel">
        <section class="hud" aria-label="Game status">
          <div class="tag" id="level">Level 1</div>
          <div class="tag" id="score">Score: 0</div>
          <div class="tag" id="timer" aria-live="off">01:00</div>
        </section>
        <p class="message" id="message" aria-live="polite">Rotate the pipes to guide the water to the drain.</p>
      </aside>
      <div class="board-wrap">
        <div class="source" aria-hidden="true"><div class="outerpipe"></div><div class="mouth"></div></div>
        <div id="board" class="board" role="group" aria-label="Pipe puzzle board"></div>
        <div class="goal" aria-hidden="true"><div class="outerpipe"></div><div class="mouth"></div></div>
      </div>
      <aside class="controls-panel">
        <div class="controls" aria-label="Game controls">
          <button class="btn" id="restart" type="button">Restart</button>
          <button class="btn" id="pause" type="button" aria-pressed="false">Pause</button>
          <button class="btn" id="flow" type="button">Start Water</button>
        </div>
      </aside>
    </div>
  </main>
</body>
</html>
